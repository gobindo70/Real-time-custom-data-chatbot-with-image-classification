<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace Assistant</title>
    <style>
        :root {
            --bg-primary: #f9fafb;
            --panel-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 800px; height: 650px; background: var(--panel-bg); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .chat-header h1 { font-size: 20px; font-weight: 600; }
        .chat-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; flex-direction: column; max-width: 75%; padding: 14px 18px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .message.user { align-self: flex-end; background-color: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .message.user img { max-width: 200px; border-radius: 8px; margin-bottom: 5px; display: block; }
        .message.bot { align-self: flex-start; background-color: var(--bg-primary); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; background: var(--panel-bg); }
        .file-label { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .file-label:hover { background: var(--bg-primary); }
        .file-label input { display: none; }
        .preview-box { flex: 1; height: 44px; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: var(--text-muted); background: var(--bg-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 0 24px; height: 44px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .send-btn:hover { opacity: 0.9; }
        .send-btn:disabled { background: var(--text-muted); cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>AI Vision Assistant</h1>
        <p>Production Inference Sandbox Engine</p>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">Hello! Please attach an image file using the clip icon below to evaluate classification benchmarks.</div>
    </div>
    
    <div class="chat-input-area">
        <label class="file-label">
            📎
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect()">
        </label>
        <div class="preview-box" id="previewBox">No file selected...</div>
        <button class="send-btn" id="sendBtn" onclick="submitAnalysis()" disabled>Analyze</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const previewBox = document.getElementById('previewBox');
    const sendBtn = document.getElementById('sendBtn');
    const chatMessages = document.getElementById('chatMessages');

    function handleFileSelect() {
        if (fileInput.files.length > 0) {
            previewBox.textContent = fileInput.files[0].name;
            sendBtn.disabled = false;
        } else {
            previewBox.textContent = "No file selected...";
            sendBtn.disabled = true;
        }
    }

    async function submitAnalysis() {
        if (fileInput.files.length === 0) return;
        
        const file = fileInput.files[0];

        const reader = new FileReader();
        reader.onload = function(e) {
            appendMessage(`<img src="${e.target.result}" alt="Uploaded asset">`, 'user');
        }
        reader.readAsDataURL(file);

        sendBtn.disabled = true;
        previewBox.textContent = "Processing network inference...";

        const formData = new FormData();
        formData.append('file', file);

        try {
            // Relative path ব্যবহার করা হয়েছে যাতে CORS ইস্যু তৈরি না হয়
            const response = await fetch('/api/v1/predict', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();

            if (response.ok && data.success) {
                appendMessage(`🎯 <b>Analysis Result:</b><br>Detected Target: <b>${data.class}</b><br>Confidence Matrix: <b>${data.confidence}%</b>`, 'bot');
            } else {
                appendMessage(`⚠️ Runtime Error: ${data.error || 'Inference failed.'}`, 'bot');
            }
        } catch (error) {
            appendMessage(`❌ Communication failure connecting to Backend Engine. Details: ${error.message}`, 'bot');
        }

        fileInput.value = '';
        previewBox.textContent = "No file selected...";
    }

    function appendMessage(content, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = content;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>
</body>
</html>
